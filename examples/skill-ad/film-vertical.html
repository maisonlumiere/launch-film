        if (t >= tb(32)) { ctx.save(); ctx.filter = 'blur(24px)'; rrc(s.cx, s.cy + 28, s.w * 0.92, s.h * 0.9, s.r); ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fill(); ctx.restore(); }
        // content inside: the next film opens as a circle (b33)
        if (t >= tb(33)) {
          const fi = clamp(Math.floor((t - tb(33)) * 30), 0, IMG.reel.length - 1);
          const rev = sp(t - tb(33), 1.6, 0.86) * Math.hypot(s.w, s.h) / 2;
          ctx.save(); rrc(s.cx, s.cy, s.w, s.h, s.r); ctx.clip(); ctx.beginPath(); ctx.arc(s.cx, s.cy, Math.max(0.1, rev), 0, Math.PI * 2); ctx.clip();

          ctx.drawImage(img, s.cx - img.width * k2 / 2, s.cy - img.height * k2 / 2, img.width * k2, img.height * k2);
          ctx.restore();
        }
        const g = sp(t - tb(32), 1.6, 0.9), solid = sp(t - tb(35.2), 2.0, 0.92);
        const bevel = lerp(26, 60, g), refr = lerp(20, 34, g) * (1 - solid), mag = lerp(lerp(0.72, 0.92, g), 1, solid);
        const tool = barOn && col >= 0.02;

          Math.max(s.cx + s.w / 2, tool ? dcx + dw / 2 : -1e9) + 4, Math.max(s.cy + s.h / 2, tool ? dcy + dh / 2 : -1e9) + 4,

    }

      const labels = [[28.5, 'Keynote Clean'], [30, 'Festive'], [31, 'Night Premium']];
      let j = 0; labels.forEach((l, i) => { if (t >= tb(l[0])) j = i; });
      fUi(30, 600); const ws = labels.map((l) => ctx.measureText(l[1]).width + 56);
      const lw = chain(labels.map((l, i) => [l[0], ws[i]]), t, 2.4, 0.8);

      const lx = clamp(knobX(t), 190, 890), ly = L.bar.cy - 112;
      popAt(lx, ly, ls, () => {
        rrc(0, 0, lw, 60, 30); ctx.fillStyle = 'rgba(14,14,16,0.9)'; ctx.fill();
        ctx.save(); rrc(0, 0, lw, 60, 30); ctx.clip(); fUi(30, 600); ctx.fillStyle = C.white; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const pj = sp(t - tb(labels[j][0]), 2.8, 0.86);
        ctx.fillText(labels[j][1], 0, 2 + (1 - pj) * 60); if (j > 0) ctx.fillText(labels[j - 1][1], 0, 2 - pj * 60);
        ctx.restore(); ctx.textBaseline = 'alphabetic';
      });
    }
  }

  // ---------------- SCREEN: phone, formats, beat map, pipeline (b35 - b52) ----------------
  if (t >= tb(35) && t < tb(52.6)) {
    const s = shapeB(t), solid = t >= tb(36.5);
    const bz = 16 * clamp(sp(t - tb(35), 2.2, 0.75) - sp(t - tb(45), 2.0, 0.9), 0, 1.2);
    if (solid) {
      shadow(60, 0.22, 30); rrc(s.cx, s.cy, s.w + bz * 2, s.h + bz * 2, s.r + bz); ctx.fillStyle = C.dom; ctx.fill(); noShadow();
      ctx.save(); rrc(s.cx, s.cy, s.w, s.h, s.r); ctx.clip();
      const up = eio(span(t, 41, 41.6));
      if (t < tb(41.7)) {
        const fi = clamp(Math.floor((t - tb(33)) * 30), 0, IMG.reel.length - 1), img = IMG.reel[fi], k2 = Math.max(s.w / img.width, s.h / img.height);
        ctx.drawImage(img, s.cx - img.width * k2 / 2, s.cy - img.height * k2 / 2 - up * s.h, img.width * k2, img.height * k2);
      }
      if (t >= tb(41)) {
        ctx.fillStyle = C.dom; ctx.fillRect(s.cx - s.w / 2, s.cy - s.h / 2 + (1 - up) * s.h, s.w, s.h);
        // beat map: the film's own soundtrack, every beat marked, the playhead is now
        if (t < tb(46)) {
          const x0 = s.cx - s.w / 2 + 70, x1 = s.cx + s.w / 2 - 70, yc = s.cy + 30 + (1 - up) * s.h, amp = s.h * 0.26;
          const reveal = eio(span(t, 41.5, 42.4)), nb = 110, bw = (x1 - x0) / nb, play = t / DUR;
          for (let i = 0; i < nb; i++) {
            if (i / nb > reveal) break;
            let a = 0; for (let k = 0; k < 4; k++) a = Math.max(a, WAVE[Math.floor((i * WAVE.length) / nb) + k] || 0);
            const hh = Math.max(4, a * amp);
            ctx.fillStyle = i / nb < play ? C.white : C.dim; rr(x0 + i * bw + bw * 0.2, yc - hh, bw * 0.6, hh * 2, bw * 0.3); ctx.fill();
          }
          const ticks = eio(span(t, 42, 42.8));
          for (let b = 0; b <= NB; b++) {
            const fx = b / NB; if (fx > ticks) break;
            const tx = x0 + fx * (x1 - x0), big = b === 24 || b === 0 || b === NB;
            ctx.fillStyle = big ? C.acc : (b % 4 === 0 ? '#9A9AA0' : '#55555C'); ctx.fillRect(tx - 1.5, yc + amp + 34, 3, big ? 26 : (b % 4 === 0 ? 18 : 10));
          }
          if (t >= tb(41.5)) { const px = x0 + play * (x1 - x0); ctx.fillStyle = C.acc; ctx.fillRect(px - 2, yc - amp - 20, 4, amp * 2 + 40); }
          const lo = sp(t - tb(44.7), 2.6, 0.9);
          popAt(x0 + 90, s.cy - s.h / 2 + 60, sp(t - tb(42.5), 2.6, 0.6) * (1 - lo), () => { rrc(0, 0, 180, 52, 26); ctx.fillStyle = '#2A2A2F'; ctx.fill(); fMono(26, 600); ctx.fillStyle = C.white; ctx.textAlign = 'center'; ctx.fillText('128 BPM', 0, 9); });
          const dx = x0 + (24 / NB) * (x1 - x0);
          popAt(dx, yc - amp - 52, sp(t - tb(43), 2.6, 0.6) * (1 - lo), () => { rrc(0, 0, 112, 46, 23); ctx.fillStyle = C.acc; ctx.fill(); fMono(24, 700); ctx.fillStyle = C.white; ctx.textAlign = 'center'; ctx.fillText('drop', 0, 8); });
          popAt(x1 - 50, yc - amp - 52, sp(t - tb(43.5), 2.6, 0.6) * (1 - lo), () => { rrc(0, 0, 112, 46, 23); ctx.fillStyle = C.white; ctx.fill(); fMono(24, 700); ctx.fillStyle = C.dom; ctx.textAlign = 'center'; ctx.fillText('loop', 0, 8); });
        }
      }
      ctx.restore();
      // pipeline labels morphing inside the pill (b45.6 - b51.6)
      if (t >= tb(45.4)) {
        const steps = [[45.6, 'Brand profile', 1], [46.5, 'Variety check', 1], [47.5, 'Stills approved', 1], [48.5, 'Rendering 60 fps', 0], [50.5, 'claims.md', 1], [51.1, 'Ready', 1]];
        let j = 0; steps.forEach((st, i) => { if (t >= tb(st[0])) j = i; });
        const gone = sp(t - tb(51.6), 2.6, 0.9);
        ctx.save(); rrc(s.cx, s.cy, s.w, s.h, s.r); ctx.clip();
        const lab = (i, dy) => {
          const st = steps[i]; let txt = st[1];
          if (i === 3) txt += ` · ${Math.round(100 * eio(span(t, 48.6, 50.3)))}%`;
          fUi(40, 600); const tw = ctx.measureText(txt).width, full = tw + 56, x = s.cx - full / 2;
          ctx.save(); ctx.translate(0, dy);

          else { ctx.strokeStyle = C.acc; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(x + 20, s.cy, 16, (t / B) * Math.PI, (t / B) * Math.PI + 4.2); ctx.stroke(); }
          ctx.fillStyle = C.white; ctx.textAlign = 'left'; ctx.fillText(txt, x + 56, s.cy + 14);

    maskText('Every beat.', L.side.x, 330 + sz * 1.08, sz, () => fDisp(sz), C.dom, sp(t - tb(36.5), 2.2, 0.86), sOut(1), 'center');

      fMono(54, 600); ctx.fillStyle = C.acc; ctx.textAlign = 'left'; ctx.fillText('›', x - 6, y);

      if (((t / B) % 1) < 0.55) { ctx.fillStyle = C.acc; ctx.fillRect(x + 48 + tw, y - 38, 5, 46); }
      ctx.restore();
      popAt(e.cx + e.w / 2 + 52, e.cy, sp(t - tb(58.1), 2.6, 0.55) * (1 - sp(t - tb(60.2), 2.6, 0.9)), () => { rrc(0, 0, 76, 76, 20); ctx.fillStyle = C.acc; ctx.fill(); icon('return', 0, 0, 1, C.white); });
    }
  }

  // ---------------- WORDMARK RETURNS (b60.6 - b64) = first frame ----------------
  if (t >= tb(60.6)) {
    const k = sp(t - tb(61.2), 1.3, 0.95), wm = L.wm;
    if (k > 0.004) {
      fDisp(wm.size); ctx.letterSpacing = '0px'; ctx.fillStyle = C.dom; ctx.textAlign = 'center';
      wm.chars.forEach((ch, i) => { ctx.save(); ctx.translate(wm.dot[0] + (wm.xs[i] - wm.dot[0]) * Math.min(1, k), wm.base); ctx.scale(Math.min(1, k), 1); ctx.fillText(ch, 0, 0); ctx.restore(); });
    }
    if (!endPill || endPill.tm > 0.98 || t >= tb(61)) circle(wm.dot[0], wm.dot[1], wm.r, C.acc);
    maskText('Beat-synced launch films · a Claude Code skill', 540, 1040, 26, () => fMono(26, 500), C.grey, sp(t - tb(62.4), 2.2, 0.86), 0, 'center');
  }

  // ---------------- cursor (scales with the camera) ----------------
  const cp = cursorPos(t);
  if (cp[0] < W + 40 && cp[1] < H + 40) {
    const dn = clamp(press(t, [4, 6, 9, 11, 13, 22, 28, 38, 39, 40, 45.6, 47.5, 58]) + hold(t, 14.5, 15.45) + hold(t, 28.75, 32));
    drawCursor(cp[0], cp[1], 1.1 * Math.pow(cam.s, 0.42), dn);
  }
}
